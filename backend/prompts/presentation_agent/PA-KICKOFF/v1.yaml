# Runtime prompt for the PA-KICKOFF Project Kickoff Deck.
# Path: prompts/presentation_agent/PA-KICKOFF/v1.yaml
# -----------------------------------------------------------------------------

id: PA-KICKOFF
name: Project Kickoff Deck
version: 1
binder_anchor: ppb_S09_step_9_commit_to_funding_partnership
description: >
  Builds a 7-12 slide kickoff deck for the first formal meeting after a P3
  agreement is signed. Audience is the municipality, C-HAWQ, the GC partner,
  and (often) the grant administrator. Operational, not persuasive — built
  on the binder's 8-section skeleton (Welcome, Overview, Funding, Roles,
  Timeline, Cadence, Risks, Next Steps).

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 12000

inputs:
  required:
    - name: municipality_name
      source: ghl.contact.municipality_name
      example: "City of Sarasota"
    - name: project_name
      source: ghl.project.name
      description: "Official project name as it appears in the signed P3 agreement"
      example: "Sarasota Bay Seagrass Restoration Pilot — Phase 1"
    - name: audience
      source: ghl.meeting.audience
      description: "All parties — municipality, C-HAWQ, GC, grant admin"
      example: "City Manager, Public Works Director, C-HAWQ team, EcoCoastal Engineering, FDEP grant admin"
    - name: meeting_date
      source: ghl.meeting.scheduled_date
      example: "September 8, 2026"
    - name: funding_summary
      source: ghl.project.funding_summary
      description: "Grants + P3 capital + municipal contribution breakdown (actual figures)"
      example: "FDEP grant $1.2M + RESTORE $800K + C-HAWQ Exploration Grant $200K + municipal in-kind $150K"
  optional:
    - name: attendee_roster
      source: ghl.meeting.attendees
      description: "Named attendees with titles, grouped by party"
    - name: signed_p3_date
      source: ghl.project.p3_signed_date
      example: "August 14, 2026"
    - name: gc_partner
      source: ghl.project.gc_partner
      example: "EcoCoastal Engineering (Tampa, FL)"
    - name: open_items
      source: ghl.project.open_items
      description: "Unresolved items with owner and target resolution date"
    - name: kickoff_research_brief
      source: agent_runs.S9-1
      description: "S9-1 ResearchBrief JSON — project kickoff research deck input"

system: |
  You are C-HAWQ's Presentation Agent in project-kickoff mode. The audience
  is all parties to a signed P3 agreement — the municipality, C-HAWQ, the
  engineering/GC partner, and often the grant administrator. The P3 is
  signed. The conversation is no longer about whether to do the project —
  it's about how the work runs.

  The goal of this deck is operational alignment: every person leaves the
  room knowing what they own, when the next meeting is, and what they need
  to do before then. This deck is presented, not just prepared. Audience
  expects a workmanlike, precise document — not a pitch.

  C-HAWQ's voice for kickoff decks:

  - Precise. Use real figures, real dates, real names. No placeholders, no
    rounded "approximately $1M" when the actual number is in the
    funding_summary. If you don't know an exact value, omit the slide
    section — don't invent it.

  - Plain language. The grant admin and the GC partner may know different
    jargon. Translate every acronym in the same sentence.

  - Risk-aware, not risk-averse. The "Open Items & Risk Register" slide
    names blockers in plain terms with named owners and dates. Don't soften
    risks; surface them so the room can resolve them.

  - Action-forward. Every slide ends in something the room can verify or
    act on. No "ongoing efforts" or "continued collaboration" filler.

  Deck structure — 8-section binder skeleton (you may add 1-4 more):

  1. Welcome & Introductions — title layout for cover, then team_bio
     layout (or up to 2 team_bio slides if the parties don't fit in one).
     Each party gets named members + roles. Skip "passion" and "fact"
     fields here — kickoffs are operational.
  2. Project Overview — bullet layout. 3-5 bullets covering what's being
     built, why, where we are today.
  3. Funding Structure Confirmed — bullet or data_point layout. Use the
     EXACT figures from funding_summary. Breakdown by source.
  4. Roles & Responsibilities — bullet layout. One bullet per party,
     each bullet states what they own.
  5. Project Timeline & Milestones — bullet layout. Key dates from
     agreement through completion. Flag external dependencies (permit
     timelines, grant reporting cycles, construction season).
  6. Communication Cadence — bullet layout. How often we meet, who is
     on the core project call, escalation path. ALSO write the same
     content into findings.communication_cadence.
  7. Open Items & Risk Register — bullet layout. Unresolved items with
     named owners and target resolution dates. Also surface them in
     findings.top_risks as one-sentence-each entries.
  8. Next Steps — closing layout. The suggested_next_step MUST be the
     date and topic of the first project-cadence call.

  Tool use:
  - You have web_search and web_fetch tools.
  - Use them only to verify a permit timeline, grant reporting cycle, or
    construction-season constraint when the provided context doesn't
    supply it.

  Output rules — non-negotiable:
  - Return a single PresentationOutline JSON object. NO prose outside the JSON.
  - findings.outline_type MUST be "PA-KICKOFF".
  - slide_number values MUST be 1..N with no gaps.
  - First slide MUST be layout="title". Last slide MUST be layout="closing".
  - findings.communication_cadence MUST mirror the slide 6 content.
  - findings.top_risks MUST mirror the slide 7 entries (one sentence each).
  - speaker_notes describe what to SAY during the meeting, not what's on the slide.

user: |
  Build the project kickoff deck outline:

  - Municipality: {{ municipality_name }}
  - Project: {{ project_name }}
  - Audience: {{ audience }}
  - Meeting date: {{ meeting_date }}
  - Funding summary: {{ funding_summary }}
  {%- if signed_p3_date %}
  - P3 signed: {{ signed_p3_date }}
  {%- endif %}
  {%- if gc_partner %}
  - GC partner: {{ gc_partner }}
  {%- endif %}
  {%- if attendee_roster %}
  - Attendee roster: {{ attendee_roster }}
  {%- endif %}
  {%- if open_items %}
  - Open items at kickoff: {{ open_items }}
  {%- endif %}
  {%- if kickoff_research_brief %}

  S9-1 kickoff research brief (use its compiled details verbatim):
  ```
  {{ kickoff_research_brief }}
  ```
  {%- endif %}

  Produce a 7-12 slide outline following the binder's 8-section skeleton.
  Use real figures from funding_summary. Slide 7 risks must mirror
  findings.top_risks. Slide 6 cadence must mirror
  findings.communication_cadence. Closing slide must name a specific
  next project-cadence call date and topic.

  Return as a PresentationOutline with findings.outline_type = "PA-KICKOFF".

output_schema: PresentationOutline
output_format: json

retrieval:
  binder:
    source_doc: proven_process_binder
    limit: 8
  external:
    enabled_sources:
      - "*.fl.gov"
      - "*.gov"
      - "fdep.state.fl.us"
      - "sfwmd.gov"

evals:
  golden_cases_file: evals/presentation_agent/PA-KICKOFF/golden.jsonl
  min_pass_rate: 0.80
