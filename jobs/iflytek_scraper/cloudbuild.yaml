steps:
  # Build container
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'jobs/iflytek_scraper'
    args: [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/chawq-manatee-matinee/iflytek-repo/iflytek-job:latest',
      '.'
    ]

  # Push container
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'jobs/iflytek_scraper'
    args: [
      'push',
      'us-central1-docker.pkg.dev/chawq-manatee-matinee/iflytek-repo/iflytek-job:latest'
    ]

images:
  - 'us-central1-docker.pkg.dev/chawq-manatee-matinee/iflytek-repo/iflytek-job:latest'

serviceAccount: 'projects/chawq-manatee-matinee/serviceAccounts/chawq-builder@chawq-manatee-matinee.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY