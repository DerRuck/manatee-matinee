# CI/CD for chawq-api on Cloud Run.
# Trigger: push to main -> run pytest -> deploy from source.

steps:
  - id: 'test'
    name: 'python:3.12-slim'
    dir: 'backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -q

  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'chawq-api'
      - '--source=.'
      - '--region=us-central1'
      - '--project=chawq-manatee-matinee'
      - '--build-service-account=projects/chawq-manatee-matinee/serviceAccounts/chawq-builder@chawq-manatee-matinee.iam.gserviceaccount.com'
      - '--set-env-vars=ENV=dev,GCP_PROJECT_ID=chawq-manatee-matinee,DRIVE_WATCH_FOLDER_ID=1CJmk437SVaFcWqVBrsIOMYO1ac7oZHHq,GHL_LOCATION_ID=As8Nc8kEs6J86YgDIi9Q'
      - '--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest,GHL_PIT=ghl-pit:latest,GHL_WEBHOOK_SECRET=ghl-webhook-secret:latest'

serviceAccount: 'projects/chawq-manatee-matinee/serviceAccounts/chawq-builder@chawq-manatee-matinee.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
