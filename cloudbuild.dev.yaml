# CI/CD for chawq-api-dev on Cloud Run.
# Trigger: push to dev -> run pytest -> deploy from source.
#
# Mirrors cloudbuild.yaml (prod). Differences:
#   - Service:           chawq-api-dev (not chawq-api)
#   - DRIVE_WATCH_FOLDER_ID: dev folder id
#   - ANTHROPIC_API_KEY: bound to anthropic-api-key-dev secret
#   - ENV=dev            (already correct in prod's cloudbuild too)
#
# Re-deploys via `gcloud run deploy --set-env-vars` replace the FULL env-var
# set, so any var the runtime needs has to be listed here even if it was set
# during the initial manual deploy. Same for --set-secrets.

steps:
  - id: 'test'
    name: 'python:3.12-slim'
    dir: 'backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -q

  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'chawq-api-dev'
      - '--source=.'
      - '--region=us-central1'
      - '--project=chawq-manatee-matinee'
      - '--build-service-account=projects/chawq-manatee-matinee/serviceAccounts/chawq-builder@chawq-manatee-matinee.iam.gserviceaccount.com'
      - '--set-env-vars=ENV=dev,GCP_PROJECT_ID=chawq-manatee-matinee,GCP_LOCATION=us-central1,CLAUDE_MODEL=claude-sonnet-4-6,DRIVE_WATCH_FOLDER_ID=13YB4orVBxyB_djsvS53Jif85MBR7uC6K,GHL_LOCATION_ID=As8Nc8kEs6J86YgDIi9Q,DRIVE_OUTPUT_ROOT_FOLDER_ID=1CJmk437SVaFcWqVBrsIOMYO1ac7oZHHq'
      - '--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key-dev:latest,GHL_PIT=ghl-pit:latest,GHL_WEBHOOK_SECRET=ghl-webhook-secret:latest,CHAWQ_SHARED_SECRET=chawq-shared-secret:latest'
      - '--service-account=chawq-api-runtime@chawq-manatee-matinee.iam.gserviceaccount.com'

serviceAccount: 'projects/chawq-manatee-matinee/serviceAccounts/chawq-builder@chawq-manatee-matinee.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
